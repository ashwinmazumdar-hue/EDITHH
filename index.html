<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDITH | Campaign Intelligence</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23020610'/><text y='72' x='50' text-anchor='middle' font-size='62' font-family='monospace' font-weight='bold' fill='%2300D4FF'>E</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #020610; color: #e2e8f0; font-family: 'Syne', sans-serif; overflow: hidden; }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.3); border-radius: 2px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Last-resort catcher: if the app fails before it can render, show why
      function edithShow(msg){var r=document.getElementById('root');if(r&&!r.innerHTML.trim()){document.body.innerHTML='<div style="min-height:100vh;background:#020610;color:#FF3366;font-family:monospace;padding:40px"><h2>EDITH failed to start</h2><pre style="white-space:pre-wrap;color:#e2e8f0;font-size:13px">'+String(msg).replace(/</g,'&lt;')+'</pre><p style="color:#888">Screenshot this and send it over.</p></div>';}}
      window.addEventListener('error',function(e){edithShow((e.error&&e.error.stack)||e.message);});
      window.addEventListener('unhandledrejection',function(e){edithShow((e.reason&&e.reason.stack)||e.reason);});
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
